# Ingress for the API + docs. Point domains here after DNS is set.
# TLS via cert-manager annotation (edit cluster-issuer name as needed).
# The API host is templated so a domain switch is a single env substitution:
#   kustomize edit set replacement / sed -i "s|api.example.com|api.YOURDOMAIN.com|g"
# (or use Kustomize `configMapGenerator` + a transform to inject DOMAIN.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genesis-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: genesis-api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genesis-api
                port:
                  name: http
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genesis-frontend
                port:
                  name: http
    - host: www.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genesis-frontend
                port:
                  name: http