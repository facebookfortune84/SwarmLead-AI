# Genesis Forge API deployment
#
# Stateless HTTP service: FastAPI on :8000. Sessions live in memory and
# durable state lives in Postgres/Redis, so the API can be scaled with
# replicas. Readiness probes gate rolling deploys; liveness restarts a
# wedged pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-api
  labels:
    app: genesis-api
    tier: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: genesis-api
  template:
    metadata:
      labels:
        app: genesis-api
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: realms2riches/genesis-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: genesis-config
            - secretRef:
                name: genesis-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: genesis-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: genesis-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
