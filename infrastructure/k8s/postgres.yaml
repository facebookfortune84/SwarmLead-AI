# Postgres StatefulSet + headless service.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genesis-postgres
spec:
  serviceName: genesis-postgres
  replicas: 1
  selector:
    matchLabels:
      app: genesis-postgres
  template:
    metadata:
      labels:
        app: genesis-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "swarm"
            - name: POSTGRES_USER
              value: "swarm"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genesis-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "swarm", "-d", "swarm"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: genesis-postgres
spec:
  clusterIP: None
  selector:
    app: genesis-postgres
  ports:
    - port: 5432
      targetPort: 5432
