# Redis for queues/cache. Add nodeSelector/affinity for dedicated caching nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genesis-redis
  template:
    metadata:
      labels:
        app: genesis-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: genesis-redis
spec:
  selector:
    app: genesis-redis
  ports:
    - port: 6379
      targetPort: 6379
