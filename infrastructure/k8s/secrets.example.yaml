# Secrets template — fill values with a real secret, do NOT commit values.
# In multi-tenant setups create a copy per tenant namespace with that tenant's
# credentials (tenant_context middleware keys off the tenant/company id).
apiVersion: v1
kind: Secret
metadata:
  name: genesis-secrets
type: Opaque
stringData:
  JWT_SECRET_KEY: "CHANGE_ME_to_a_long_random_string"
  DATABASE_URL: "postgresql://swarm:CHANGE_ME@genesis-postgres:5432/swarm"
  REDIS_URL: "redis://genesis-redis:6379/0"
  ELEVENLABS_API_KEY: "CHANGE_ME"
  ELEVENLABS_DEFAULT_VOICE_ID: "CHANGE_ME"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASS: "CHANGE_ME"
  # Branded sending alias — see docs/email_alias.md
  SMTP_FROM: "hello@realms2riches.com"
