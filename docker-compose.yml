services:

  postgres:
    image: postgres:16-alpine
    container_name: swarmlead-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: swarm
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: SwarmLead2026!

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swarmlead-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .

    container_name: swarmlead-api

    restart: unless-stopped

    env_file:
      - .env.docker
      - .env.docker.local

    environment:
      REDIS_URL: redis://redis:6379/0
      DYNAMIC_TUNNEL_MODE: ${DYNAMIC_TUNNEL_MODE:-0}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_BACKEND_URL: http://api:8000
        NEXT_PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-realms2riches.com}

    container_name: swarmlead-frontend

    restart: unless-stopped

    environment:
      API_BACKEND_URL: http://api:8000
      NEXT_PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-realms2riches.com}

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_started

  # ── Cloudflare Tunnel (optional; enable with: docker compose --profile tunnel up -d)
  # Free hosting: exposes the full stack on your Cloudflare account via a
  # remote tunnel. Set CLOUDFLARE_TUNNEL_TOKEN (from the Cloudflare dashboard
  # -> Zero Trust -> Networks -> Tunnels -> Create -> Remotely-managed) and
  # map public hostnames to http://frontend:3000 (and http://api:8000 as needed).
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: swarmlead-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_started

  # ── Tunnel Auto-Pilot (enable with: docker compose --profile tunnel-quick up -d)
  # Free Quick Tunnel with NO account/domain. Publishes the current
  # trycloudflare.com URL to Redis (`site:public_url`, 24h TTL) and rotates
  # it daily + on every boot. With DYNAMIC_TUNNEL_MODE=1 the API and
  # frontend follow the URL at request time (CORS, SEO, shares, Stripe).
  tunnel-quick:
    build:
      context: ./infrastructure/tunnel-quick
    container_name: swarmlead-tunnel-quick
    restart: unless-stopped
    profiles: ["tunnel-quick"]
    environment:
      TUNNEL_TARGET: http://frontend:3000
      REDIS_URL: redis://redis:6379/0
      SYNC_INTERVAL_HOURS: ${TUNNEL_SYNC_INTERVAL_HOURS:-24}
    depends_on:
      frontend:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: