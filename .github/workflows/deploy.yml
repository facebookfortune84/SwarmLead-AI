name: Deploy containers (Cloudflare Tunnel host)

# Builds fresh containers on the host machine that runs the Docker stack
# behind the Cloudflare Tunnel. Runs on a SELF-HOSTED runner so no cloud
# build minutes are used and the containers land directly where the
# tunnel serves them.
#
# One-time host setup (runs the built images from the local checkout):
#   1. Register a self-hosted runner on this repo with label `docker-host`
#      https://github.com/facebookfortune84/SwarmLead-AI/settings/actions/runners
#     2. On the host, keep a clone of the repo in C:\SwarmLead-AI
#        (it should already be there)
#   3. The workflow below pulls, rebuilds, and restarts the stack.
#
# Alternative (no self-hosted runner): SSH into the host and run
#   docker compose up -d --build

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy:
    name: Rebuild + restart stack
    runs-on: [self-hosted, docker-host]
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and restart
        shell: bash
        run: |
          docker compose up -d --build --force-recreate
          docker image prune -f >/dev/null 2>&1 || true
          echo "Stack restarted. Verify:"
          docker ps --format "table {{.Names}}\t{{.Status}}"

      - name: Smoke check
        shell: bash
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$code" = "200" ]; then echo "frontend OK"; break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health && echo "api OK"