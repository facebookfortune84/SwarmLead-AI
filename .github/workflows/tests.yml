name: Swarm Tests

on:
  push:
    branches: [ main, release/** ]
  pull_request:

env:
  JWT_SECRET_KEY: ci-test-secret-key-for-github-actions-2026
  SWARM_DB_URL: ""
  DATABASE_URL: ""
  GROWTH_AUTO_MODE: "0"

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint (ruff)
      run: |
        ruff check core interfaces tests utils

    - name: Run tests (unit + integration)
      run: |
        python tests/run_tests.py --cov-fail-under=96

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Run frontend tests
      run: npm test

    - name: Build
      run: npm run build